name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl3-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2

  rpm-almalinux10:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM and Plasma build dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y gcc-c++ cmake make git curl rpm-build rpmdevtools \
            SDL3-devel mesa-libGL-devel extra-cmake-modules libplasma-devel \
            kf6-kcoreaddons-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            qt6-qtshadertools-devel
      - name: Create source archive
        run: |
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar.gz --prefix=galacticorbit-screensaver-0.1.0/ HEAD \
            > ~/rpmbuild/SOURCES/galacticorbit-screensaver-0.1.0.tar.gz
          cp packaging/galacticorbit-screensaver.spec ~/rpmbuild/SPECS/
      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/galacticorbit-screensaver.spec
      - name: Upload AlmaLinux 10 RPM
        uses: actions/upload-artifact@v4
        with:
          name: galacticorbit-almalinux-10-rpm
          path: ~/rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error
