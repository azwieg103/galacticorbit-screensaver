name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl3-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2

  rpm-el10:
    name: Enterprise Linux 10 RPM
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM and Plasma build dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y gcc-c++ cmake make git tar rpm-build rpmdevtools \
            SDL3-devel mesa-libGL-devel extra-cmake-modules libplasma-devel \
            kf6-kcoreaddons-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            qt6-qtshadertools-devel
      - name: Create source archive
        run: |
          mkdir -p ~/rpmbuild/BUILD ~/rpmbuild/BUILDROOT ~/rpmbuild/RPMS ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/SRPMS
          tar --exclude=.git --transform='s,^,galacticorbit-screensaver-0.1.0/,' \
            -czf ~/rpmbuild/SOURCES/galacticorbit-screensaver-0.1.0.tar.gz -C "$GITHUB_WORKSPACE" .
          cp packaging/galacticorbit-screensaver.spec ~/rpmbuild/SPECS/
      - name: Build RPM and SRPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/galacticorbit-screensaver.spec
      - name: Upload EL10 packages
        uses: actions/upload-artifact@v4
        with:
          name: galacticorbit-el10-x86_64
          path: |
            /root/rpmbuild/RPMS/x86_64/*.rpm
            /root/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error

  windows:
    name: Windows x64 ZIP and MSI
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\\vcpkg
      PRODUCT_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\\vcpkg.exe" install sdl3:x64-windows
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\\scripts\\buildsystems\\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\\windows\\assets\\planet-textures | Out-Null
          Copy-Item build\\Release\\galacticorbit-screensaver.exe dist\\windows\\
          Copy-Item "$env:VCPKG_ROOT\\installed\\x64-windows\\bin\\SDL3.dll" dist\\windows\\
          Copy-Item assets\\planet-textures\\* dist\\windows\\assets\\planet-textures\\
          Compress-Archive -Path dist\\windows\\* -DestinationPath galacticorbit-windows-x64.zip -Force
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1 --yes --no-progress
      - name: Build MSI installer
        shell: pwsh
        run: |
          $wix = "$env:ProgramFiles(x86)\\WiX Toolset v3.14\\bin"
          & "$wix\\heat.exe" dir "$env:GITHUB_WORKSPACE\\dist\\windows" -cg AppFiles -dr INSTALLFOLDER -gg -srd -var var.SourceDir -out "$env:RUNNER_TEMP\\Files.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX heat failed" }
          & "$wix\\candle.exe" -nologo "-dProductVersion=$env:PRODUCT_VERSION" "-dSourceDir=$env:GITHUB_WORKSPACE\\dist\\windows" -out "$env:RUNNER_TEMP\\" packaging\\windows\\Product.wxs "$env:RUNNER_TEMP\\Files.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX candle failed" }
          & "$wix\\light.exe" -nologo -out galacticorbit-windows-x64.msi "$env:RUNNER_TEMP\\Product.wixobj" "$env:RUNNER_TEMP\\Files.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "WiX light failed" }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: galacticorbit-windows-x64
          path: |
            galacticorbit-windows-x64.zip
            galacticorbit-windows-x64.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rpm-el10, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
