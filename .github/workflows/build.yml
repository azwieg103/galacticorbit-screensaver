name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl3-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2

  windows:
    name: Windows x64 ZIP and MSI
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      PRODUCT_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install SDL3
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install sdl3:x64-windows
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/assets/planet-textures | Out-Null
          Copy-Item build/Release/galacticorbit-screensaver.exe dist/windows/
          Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/bin/SDL3.dll" dist/windows/
          Copy-Item assets/planet-textures/* dist/windows/assets/planet-textures/
          Compress-Archive -Path dist/windows/* -DestinationPath galacticorbit-windows-x64.zip -Force
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}/WiX Toolset v3.14/bin"
          if (!(Test-Path "$wix/candle.exe") -or !(Test-Path "$wix/light.exe") -or !(Test-Path "$wix/heat.exe")) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress --force
            if ($LASTEXITCODE -ne 0) { throw "WiX Toolset installation failed" }
          }
      - name: Build MSI installer
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}/WiX Toolset v3.14/bin"
          & "$wix/heat.exe" dir "$env:GITHUB_WORKSPACE/dist/windows" -cg AppFiles -dr INSTALLFOLDER -gg -srd -var var.SourceDir -out "$env:RUNNER_TEMP/Files.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX heat failed" }
          & "$wix/candle.exe" -nologo -arch x64 "-dProductVersion=$env:PRODUCT_VERSION" -out "$env:RUNNER_TEMP/Product.wixobj" packaging/windows/Product.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX Product compile failed" }
          & "$wix/candle.exe" -nologo -arch x64 "-dSourceDir=$env:GITHUB_WORKSPACE/dist/windows" -out "$env:RUNNER_TEMP/Files.wixobj" "$env:RUNNER_TEMP/Files.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX file compile failed" }
          & "$wix/light.exe" -nologo -out galacticorbit-windows-x64.msi "$env:RUNNER_TEMP/Product.wixobj" "$env:RUNNER_TEMP/Files.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "WiX link failed" }
      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: galacticorbit-windows-x64
          path: |
            galacticorbit-windows-x64.zip
            galacticorbit-windows-x64.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
