<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Galactic Orbit — Milky Way overview</title>
<desc id="desc">Illustrated top-down view of the Milky Way with four major spiral arms, Sagittarius A star at the center, the Orion Spur and the Sun's location.</desc>
<defs>
  <radialGradient id="space"><stop stop-color="#101a32"/><stop offset=".55" stop-color="#050b19"/><stop offset="1" stop-color="#01030a"/></radialGradient>
  <radialGradient id="bulge"><stop stop-color="#ffe3bd" stop-opacity=".95"/><stop offset=".18" stop-color="#f7a96d" stop-opacity=".55"/><stop offset=".55" stop-color="#a56c86" stop-opacity=".15"/><stop offset="1" stop-color="#15213b" stop-opacity="0"/></radialGradient>
  <linearGradient id="armBlue"><stop stop-color="#426eaa" stop-opacity="0"/><stop offset=".28" stop-color="#6b9dd9" stop-opacity=".35"/><stop offset=".52" stop-color="#d1e4ff" stop-opacity=".8"/><stop offset=".72" stop-color="#4776b8" stop-opacity=".4"/><stop offset="1" stop-color="#31528a" stop-opacity="0"/></linearGradient>
  <linearGradient id="dust"><stop stop-color="#101321" stop-opacity="0"/><stop offset=".5" stop-color="#090c18" stop-opacity=".95"/><stop offset="1" stop-color="#101321" stop-opacity="0"/></linearGradient>
  <radialGradient id="sunGlow"><stop stop-color="#fffde8"/><stop offset=".18" stop-color="#fff2b2"/><stop offset=".48" stop-color="#ffb84e" stop-opacity=".75"/><stop offset="1" stop-color="#ff9b36" stop-opacity="0"/></radialGradient>
  <radialGradient id="planet"><stop stop-color="#9ed1ff"/><stop offset=".72" stop-color="#3674a8"/><stop offset="1" stop-color="#101d38"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="820" fill="url(#space)"/>
<!-- sparse background stars -->
<g fill="#dce9ff">
<circle cx="54" cy="92" r="1.4"/><circle cx="121" cy="244" r="1"/><circle cx="180" cy="65" r="1.6"/><circle cx="266" cy="150" r="1"/><circle cx="328" cy="53" r="1.2"/><circle cx="401" cy="270" r="1"/><circle cx="495" cy="88" r="1.5"/><circle cx="568" cy="191" r="1"/><circle cx="654" cy="44" r="1.1"/><circle cx="744" cy="103" r="1.5"/><circle cx="829" cy="53" r="1"/><circle cx="932" cy="142" r="1.3"/><circle cx="1044" cy="65" r="1"/><circle cx="1130" cy="180" r="1.5"/><circle cx="1244" cy="76" r="1"/><circle cx="1341" cy="208" r="1.4"/>
<circle cx="83" cy="660" r="1"/><circle cx="194" cy="748" r="1.3"/><circle cx="302" cy="620" r="1"/><circle cx="420" cy="768" r="1.5"/><circle cx="540" cy="690" r="1"/><circle cx="650" cy="780" r="1.2"/><circle cx="790" cy="700" r="1"/><circle cx="920" cy="768" r="1.5"/><circle cx="1050" cy="668" r="1"/><circle cx="1180" cy="760" r="1.3"/><circle cx="1300" cy="650" r="1"/>
</g>
<!-- broad galactic disk and central bulge -->
<ellipse cx="700" cy="405" rx="590" ry="285" fill="#25385d" opacity=".13" filter="url(#blur)"/>
<ellipse cx="700" cy="405" rx="310" ry="210" fill="url(#bulge)"/>
<ellipse cx="700" cy="405" rx="165" ry="95" fill="#d68d70" opacity=".12" filter="url(#blur)"/>
<!-- major spiral arms: luminous broad lanes plus dark dust lanes -->
<g fill="none" stroke-linecap="round">
<path d="M720 395 C850 300 1000 295 1100 360 C1215 435 1225 555 1110 620 C1000 684 865 625 840 535 C820 465 875 415 970 420 C1060 425 1115 485 1080 535" stroke="#5e8dc9" stroke-width="76" opacity=".18" filter="url(#blur)"/>
<path d="M720 395 C850 300 1000 295 1100 360 C1215 435 1225 555 1110 620 C1000 684 865 625 840 535 C820 465 875 415 970 420 C1060 425 1115 485 1080 535" stroke="url(#armBlue)" stroke-width="35" opacity=".75"/>
<path d="M680 410 C550 510 400 515 300 450 C185 375 175 255 290 190 C400 126 535 185 560 275 C580 345 525 395 430 390 C340 385 285 325 320 275" stroke="#6b9bd3" stroke-width="76" opacity=".18" filter="url(#blur)"/>
<path d="M680 410 C550 510 400 515 300 450 C185 375 175 255 290 190 C400 126 535 185 560 275 C580 345 525 395 430 390 C340 385 285 325 320 275" stroke="url(#armBlue)" stroke-width="34" opacity=".8"/>
<path d="M700 385 C620 265 630 150 710 95 C805 30 940 80 965 170 C990 260 930 315 845 290 C770 268 745 205 785 160" stroke="#6c9dd7" stroke-width="68" opacity=".18" filter="url(#blur)"/>
<path d="M700 385 C620 265 630 150 710 95 C805 30 940 80 965 170 C990 260 930 315 845 290 C770 268 745 205 785 160" stroke="url(#armBlue)" stroke-width="32" opacity=".78"/>
<path d="M700 425 C780 545 770 660 690 715 C595 780 460 730 435 640 C410 550 470 495 555 520 C630 545 655 605 615 650" stroke="#6c9dd7" stroke-width="68" opacity=".18" filter="url(#blur)"/>
<path d="M700 425 C780 545 770 660 690 715 C595 780 460 730 435 640 C410 550 470 495 555 520 C630 545 655 605 615 650" stroke="url(#armBlue)" stroke-width="32" opacity=".78"/>
<!-- dust lanes -->
<path d="M720 395 C850 300 1000 295 1100 360 C1215 435 1225 555 1110 620" stroke="url(#dust)" stroke-width="17" opacity=".85"/>
<path d="M680 410 C550 510 400 515 300 450 C185 375 175 255 290 190" stroke="url(#dust)" stroke-width="17" opacity=".85"/>
<path d="M700 385 C620 265 630 150 710 95 C805 30 940 80 965 170" stroke="url(#dust)" stroke-width="15" opacity=".8"/>
<path d="M700 425 C780 545 770 660 690 715 C595 780 460 730 435 640" stroke="url(#dust)" stroke-width="15" opacity=".8"/>
</g>
<!-- star-forming knots -->
<g fill="#f6c6a6" filter="url(#soft)" opacity=".8">
<circle cx="1015" cy="325" r="13"/><circle cx="1135" cy="435" r="10"/><circle cx="1035" cy="610" r="12"/><circle cx="390" cy="190" r="12"/><circle cx="245" cy="340" r="10"/><circle cx="500" cy="690" r="11"/><circle cx="760" cy="105" r="10"/><circle cx="900" cy="165" r="9"/>
</g>
<!-- Orion Spur branching locally from the Sagittarius/Perseus region -->
<path d="M820 455 C900 475 965 515 1035 535 C1100 552 1160 548 1225 525" fill="none" stroke="#5d9bd8" stroke-width="48" opacity=".18" filter="url(#blur)"/>
<path d="M820 455 C900 475 965 515 1035 535 C1100 552 1160 548 1225 525" fill="none" stroke="#8bb9ec" stroke-width="13" opacity=".78" filter="url(#soft)"/>
<path d="M820 455 C900 475 965 515 1035 535 C1100 552 1160 548 1225 525" fill="none" stroke="#d9eaff" stroke-width="2" opacity=".7"/>
<!-- Sagittarius A*: deliberately enlarged for legibility -->
<g transform="translate(700 405)">
 <ellipse rx="82" ry="28" fill="none" stroke="#f6a66a" stroke-width="14" opacity=".22" filter="url(#blur)"/>
 <ellipse rx="70" ry="21" fill="none" stroke="#ffb66e" stroke-width="8" opacity=".9" filter="url(#soft)"/>
 <ellipse rx="54" ry="14" fill="none" stroke="#fff0c9" stroke-width="3" opacity=".95"/>
 <ellipse rx="30" ry="9" fill="#ff9e54" opacity=".85"/>
 <circle r="16" fill="#000" stroke="#090b16" stroke-width="4"/>
 <circle r="20" fill="none" stroke="#ffe2ad" stroke-width="1.5" opacity=".8"/>
</g>
<!-- Sun in the Orion Spur and a compact scale-inset planetary lineup -->
<g>
 <circle cx="1080" cy="541" r="38" fill="url(#sunGlow)"/>
 <circle cx="1080" cy="541" r="8" fill="#fff8d6" filter="url(#glow)"/>
 <path d="M1088 532 L1140 485" stroke="#fff0c7" stroke-width="1.5"/>
 <text x="1148" y="478" fill="#fff4dc" font-family="Arial,sans-serif" font-size="18" font-weight="bold">SUN</text>
 <text x="1148" y="499" fill="#a9c8ee" font-family="Arial,sans-serif" font-size="14">Orion Spur</text>
 <path d="M1080 552 C1110 588 1150 600 1210 590" fill="none" stroke="#f7c878" stroke-width="1" stroke-dasharray="3 5" opacity=".65"/>
 <g transform="translate(1170 580)">
  <circle cx="0" cy="0" r="3" fill="#a9a9a9"/><circle cx="18" cy="-4" r="4" fill="#d9b68a"/><circle cx="42" cy="-2" r="5.5" fill="url(#planet)"/>
  <circle cx="72" cy="-8" r="4.5" fill="#c9784e"/><circle cx="102" cy="-3" r="10" fill="#c99a62"/><path d="M120 -4 q15 -12 30 0 q-15 12 -30 0" fill="none" stroke="#d6c19d" stroke-width="3"/>
  <circle cx="166" cy="-5" r="7" fill="#91c6d5"/><circle cx="190" cy="-4" r="6" fill="#557da8"/>
 </g>
</g>
<!-- labels -->
<g font-family="Arial,sans-serif" fill="#d9e7fa">
 <text x="46" y="54" font-size="34" font-weight="bold" letter-spacing="2">GALACTIC ORBIT</text>
 <text x="48" y="82" font-size="14" fill="#91a9c9" letter-spacing="1.5">A TOP-DOWN VIEW OF OUR MILKY WAY</text>
 <text x="890" y="250" font-size="19" fill="#ffe4c4" font-weight="bold">SAGITTARIUS A*</text>
 <text x="890" y="273" font-size="13" fill="#b9c8dc">central supermassive black hole</text>
 <path d="M875 278 L760 390" stroke="#ffe4c4" stroke-width="1.3" opacity=".8"/>
 <text x="1030" y="130" font-size="17" fill="#b7c9e4" opacity=".85">NORMA ARM</text>
 <text x="1030" y="151" font-size="12" fill="#8198ba" opacity=".8">outer spiral structure</text>
 <text x="109" y="225" font-size="17" fill="#b7c9e4" opacity=".85">PERSEUS ARM</text>
 <text x="109" y="246" font-size="12" fill="#8198ba" opacity=".8">major outer arm</text>
 <text x="250" y="580" font-size="17" fill="#b7c9e4" opacity=".85">SAGITTARIUS ARM</text>
 <text x="250" y="601" font-size="12" fill="#8198ba" opacity=".8">major inner arm</text>
 <text x="850" y="715" font-size="17" fill="#b7c9e4" opacity=".85">SCUTUM–CENTAURUS ARM</text>
 <text x="850" y="736" font-size="12" fill="#8198ba" opacity=".8">major spiral arm</text>
 <text x="955" y="625" font-size="19" fill="#c9e5ff" font-weight="bold">ORION SPUR</text>
 <text x="955" y="646" font-size="13" fill="#a5c6ed">our Solar System's local arm segment</text>
 <path d="M1050 610 L1075 554" stroke="#a5c6ed" stroke-width="1.2"/>
</g>
<g transform="translate(48 700)" font-family="Arial,sans-serif">
 <rect width="310" height="76" rx="8" fill="#080e1b" stroke="#344867" opacity=".94"/>
 <text x="16" y="25" fill="#e7effb" font-size="13" font-weight="bold">SCHEMATIC — NOT TO SCALE</text>
 <text x="16" y="46" fill="#9fb2cf" font-size="12">Spiral structure and pattern speeds remain</text>
 <text x="16" y="63" fill="#9fb2cf" font-size="12">active areas of astronomical research.</text>
</g>
</svg>