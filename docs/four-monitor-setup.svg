<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Galactic Orbit across four monitors</title>
<desc id="desc">A stylized illustration of a four-monitor workstation displaying a continuous blue spiral galaxy, bright galactic core, arm labels, and the Solar System.</desc>
<defs>
  <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#050b1b"/><stop offset="1" stop-color="#020511"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#fff8e9"/><stop offset=".12" stop-color="#fff0c9"/><stop offset=".23" stop-color="#ffb5a1"/><stop offset=".42" stop-color="#6e7eff" stop-opacity=".85"/><stop offset="1" stop-color="#111b42" stop-opacity="0"/></radialGradient>
  <radialGradient id="nebula"><stop stop-color="#66aaff" stop-opacity=".3"/><stop offset="1" stop-color="#2d50b8" stop-opacity="0"/></radialGradient>
  <linearGradient id="bezel" x2="0" y2="1"><stop stop-color="#384253"/><stop offset=".12" stop-color="#101722"/><stop offset="1" stop-color="#080d15"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <clipPath id="screens"><rect x="0" y="0" width="660" height="390" rx="7"/></clipPath>
  <g id="galaxy">
    <ellipse cx="0" cy="0" rx="345" ry="190" fill="url(#nebula)"/>
    <g fill="none" stroke="#287cff" stroke-linecap="round">
      <ellipse rx="330" ry="183" transform="rotate(-14)" stroke-width="9" opacity=".65" filter="url(#soft)"/>
      <ellipse rx="262" ry="144" transform="rotate(20)" stroke-width="6" opacity=".72" filter="url(#soft)"/>
      <ellipse rx="193" ry="105" transform="rotate(-19)" stroke-width="5" opacity=".6" filter="url(#soft)"/>
      <ellipse rx="330" ry="183" transform="rotate(-14)" stroke-width="3" opacity=".8"/>
      <ellipse rx="262" ry="144" transform="rotate(20)" stroke-width="2.5" opacity=".9"/>
      <ellipse rx="193" ry="105" transform="rotate(-19)" stroke-width="2" opacity=".75"/>
    </g>
    <ellipse rx="112" ry="43" fill="url(#core)" filter="url(#glow)"/>
    <ellipse rx="88" ry="23" fill="none" stroke="#f9e8ff" stroke-width="9" opacity=".9" filter="url(#soft)"/>
    <ellipse rx="73" ry="16" fill="none" stroke="#ffbd9b" stroke-width="4" opacity=".9"/>
    <ellipse rx="48" ry="10" fill="#fff7ed" opacity=".85"/>
    <circle r="9" fill="#060916"/>
  </g>
  <g id="stars" fill="#d7e7ff">
    <circle cx="48" cy="72" r="1.5"/><circle cx="160" cy="42" r="1.2"/><circle cx="570" cy="66" r="1.3"/>
    <circle cx="608" cy="300" r="1.1"/><circle cx="92" cy="330" r="1.1"/><circle cx="430" cy="354" r="1.3"/>
    <circle cx="285" cy="92" r="1"/><circle cx="525" cy="180" r="1.1"/><circle cx="220" cy="286" r="1.1"/>
    <circle cx="350" cy="46" r="1.1"/><circle cx="36" cy="235" r="1.1"/><circle cx="595" cy="120" r="1"/>
  </g>
</defs>
<rect width="1440" height="960" fill="#111824"/>
<path d="M0 0H1440V960H0Z" fill="#172131"/>
<text x="720" y="56" fill="#e4edf9" font-family="sans-serif" font-size="25" text-anchor="middle" letter-spacing="4">GALACTIC ORBIT · FOUR-DISPLAY VIEW</text>
<!-- Four monitor housings -->
<g transform="translate(44 100)">
  <g fill="url(#bezel)" stroke="#536174" stroke-width="3">
    <rect x="0" y="0" width="674" height="414" rx="15"/>
    <rect x="678" y="0" width="674" height="414" rx="15"/>
    <rect x="0" y="420" width="674" height="414" rx="15"/>
    <rect x="678" y="420" width="674" height="414" rx="15"/>
  </g>
  <g transform="translate(7 7)" clip-path="url(#screens)">
    <rect width="660" height="390" fill="url(#screen)"/><use href="#stars"/>
    <g transform="translate(495 345) scale(.72)"><use href="#galaxy"/></g>
    <text x="22" y="30" fill="#e4f1ff" font-size="17" font-weight="700" font-family="sans-serif">Milky Way Galaxy</text>
    <text x="22" y="52" fill="#c6dcf7" font-size="14" font-family="sans-serif">Sagittarius A Black Hole</text>
    <text x="292" y="240" fill="#d4e8ff" font-size="10" letter-spacing="2">PERSEUS ARM</text>
  </g>
  <g transform="translate(685 7)" clip-path="url(#screens)">
    <rect width="660" height="390" fill="url(#screen)"/><use href="#stars"/>
    <g transform="translate(-120 345) scale(.72)"><use href="#galaxy"/></g>
    <text x="310" y="210" fill="#d4e8ff" font-size="10" letter-spacing="2">NORMA–OUTER ARM</text>
  </g>
  <g transform="translate(7 427)" clip-path="url(#screens)">
    <rect width="660" height="390" fill="url(#screen)"/><use href="#stars"/>
    <g transform="translate(495 -75) scale(.72)"><use href="#galaxy"/></g>
    <g transform="translate(400 260)">
      <ellipse rx="64" ry="28" fill="none" stroke="#a5c9ff" stroke-width="1.5" opacity=".5" transform="rotate(25)"/>
      <ellipse rx="52" ry="22" fill="none" stroke="#a5c9ff" stroke-width="1.2" opacity=".5" transform="rotate(-18)"/>
      <ellipse rx="39" ry="16" fill="none" stroke="#a5c9ff" stroke-width="1" opacity=".45" transform="rotate(48)"/>
      <circle r="8" fill="#ffb45e" filter="url(#soft)"/><circle r="4" fill="#fff2ce"/>
      <g fill="#d9efff" stroke="#7fb6ff" stroke-width="1"><circle cx="-42" cy="-7" r="4"/><circle cx="38" cy="11" r="5"/><circle cx="13" cy="-25" r="3"/><circle cx="-12" cy="25" r="4"/><circle cx="57" cy="-16" r="3"/></g>
    </g>
    <text x="35" y="354" fill="#c5dcfa" font-size="10" letter-spacing="2">ORION SPUR · SOLAR SYSTEM</text>
  </g>
  <g transform="translate(685 427)" clip-path="url(#screens)">
    <rect width="660" height="390" fill="url(#screen)"/><use href="#stars"/>
    <g transform="translate(-120 -75) scale(.72)"><use href="#galaxy"/></g>
    <text x="300" y="285" fill="#d4e8ff" font-size="10" letter-spacing="2">SCUTUM–CENTAURUS ARM</text>
  </g>
  <!-- Center bezel cross and monitor stands -->
  <path d="M674 0V834M0 417H1352" stroke="#080d14" stroke-width="12" opacity=".9"/>
  <g fill="#202a39"><rect x="658" y="834" width="36" height="48" rx="5"/><path d="M600 882H752L780 900H572Z"/></g>
</g>
<text x="720" y="938" fill="#aabbd2" font-family="sans-serif" font-size="15" text-anchor="middle">Stylized illustration based on the four-monitor Galactic Orbit setup</text>
</svg>